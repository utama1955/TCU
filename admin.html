<html>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);

.limit-btn {
  background:#2c5364;
  color:white;
}

  background:#27ae60;

}

.waiting{background:#f39c12;}
.pending{background:#9b59b6;}
.process{background:#3498db;}
.done{background:#27ae60;}
