<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History Laporan</title>
<link rel="icon" type="image/png" href="icon.png">

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
min-height:100vh;
display:flex;
justify-content:center;
align-items:flex-start;
padding:32px 15px;
color:#15262d;
}

.container{
background:white;
width:100%;
max-width:720px;
border-radius:10px;
box-shadow:0 18px 42px rgba(0,0,0,0.32);
overflow:hidden;
}

.page-title{
margin:0;
padding:22px 24px 18px;
background:#2c5364;
color:white;
font-size:21px;
text-align:center;
}

.content{
padding:24px;
}

.field-label{
display:block;
font-size:13px;
font-weight:700;
color:#244f60;
margin-bottom:6px;
}

input{
width:100%;
padding:14px;
border-radius:8px;
border:1px solid #c8d4d9;
font-size:14px;
text-transform:uppercase;
}

input:focus{
border-color:#2c5364;
outline:none;
box-shadow:0 0 0 3px rgba(44,83,100,0.16);
}

button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:8px;
border:0;
font-size:14px;
font-weight:700;
cursor:pointer;
background:#2c5364;
color:white;
transition:0.2s;
}

button:hover{
background:#203a43;
transform:translateY(-1px);
}

button:disabled{
background:#bdc3c7;
cursor:not-allowed;
transform:none;
}

.back-btn{
background:#6c757d;
}

.result{
margin-top:18px;
}

.empty-state,
.loading-box{
background:#f7fafb;
border:1px solid #e3ebee;
border-radius:10px;
padding:18px;
text-align:center;
color:#52666e;
}

.history-list{
margin-top:12px;
padding-left:14px;
border-left:3px solid #dce8ec;
}

.history-item{
position:relative;
padding:0 0 16px 14px;
}

.history-item:before{
content:"";
position:absolute;
left:-22px;
top:4px;
width:10px;
height:10px;
border-radius:50%;
background:#2c5364;
border:2px solid white;
box-shadow:0 0 0 2px #dce8ec;
}

.history-date{
font-size:12px;
font-weight:700;
color:#52666e;
margin-bottom:3px;
}

.history-action{
font-weight:800;
color:#244f60;
margin-bottom:4px;
}

.history-meta{
font-size:12px;
color:#52666e;
line-height:1.45;
}

.history-text{
margin:5px 0;
color:#13272f;
line-height:1.45;
}

.ticket-title{
width:max-content;
max-width:100%;
margin:0 auto 16px;
padding:9px 16px;
border:2px solid #d94a35;
border-radius:8px;
font-weight:800;
color:#d94a35;
margin-bottom:12px;
text-align:center;
word-break:break-word;
}

a{
display:block;
text-decoration:none;
}

@media (max-width:480px){
body{
padding:20px 12px;
}

.content{
padding:20px;
}
}
</style>
</head>

<body>
<script>
const token = localStorage.getItem("token");

if(!token){
  alert("Silakan login terlebih dahulu");
  window.location.href = "login.html";
}
</script>

<div class="container">
  <h2 class="page-title">HISTORY LAPORAN</h2>

  <div class="content">
    <label class="field-label" for="ticket">Ticket ID</label>
    <input id="ticket" placeholder="Contoh: TCU-GA-2026-0019" autocomplete="off">

    <button id="btnCekHistory" onclick="loadTicketHistory()">CEK HISTORY</button>

    <div id="hasil" class="result"></div>

    <a href="index.html">
      <button class="back-btn">Kembali ke Menu Utama</button>
    </a>
  </div>
</div>

<script src="config.js"></script>
<script src="history.js"></script>
</body>
</html>
