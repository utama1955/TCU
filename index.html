<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapor Bolo - Home</title>
<link rel="icon" type="image/png" href="icon.png">

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
    }

    .container {
        background: white;
        width: 100%;
        max-width: 420px;
        border-radius: 14px;
        box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        padding: 30px 25px;
        text-align: center;
    }

    .banner {
        width: 100%;
        margin-bottom: 20px;
        border-radius: 10px;
    }

    h2 { margin: 0 0 25px 0; font-size: 20px; color: #333; }

    #userInfo {
        margin-bottom: 25px;
        padding: 12px;
        background: #f1f4f6;
        border-radius: 8px;
        font-size: 15px;
        color: #2c3e50;
        font-weight: bold;
        border-left: 5px solid #2c5364;
    }

    button {
        width: 100%;
        padding: 15px;
        margin-top: 12px;
        background: #2c5364;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.3s;
    }

    button:hover { background: #203a43; transform: translateY(-2px); }

    .menu-link {
        display: block;
        position: relative;
        text-decoration: none;
    }

    .menu-badge {
        display: none;
        position: absolute;
        top: 4px;
        right: -7px;
        min-width: 24px;
        height: 24px;
        padding: 0 7px;
        border-radius: 999px;
        background: #e74c3c;
        color: white;
        border: 2px solid white;
        box-shadow: 0 3px 8px rgba(0,0,0,0.24);
        font-size: 12px;
        font-weight: 800;
        line-height: 20px;
        text-align: center;
        z-index: 2;
    }

    .admin-btn { background: #8e44ad; }
    .admin-btn:hover { background: #7d3c98; }

    /* Pemisah tombol logout */
    .separator {
        margin-top: 30px;
        border: 0;
        border-top: 1px solid #eee;
    }

    .logout-btn { 
        background: #e74c3c; 
        margin-top: 15px; /* Jarak tambahan setelah garis */
        font-size: 13px;
        padding: 12px;
    }
    .logout-btn:hover { background: #c0392b; }
</style>
</head>

<body>

<div class="container">
    <img src="Banner Utama.png" class="banner" alt="Banner">

    <h2>LAPOR BOLO</h2>

    <div id="userInfo">Memuat nama...</div>

    <a class="menu-link" href="lapor.html"><button>LAPOR KERUSAKAN</button></a>
    <a class="menu-link" href="cek.html">
        <button>CEK STATUS LAPORAN</button>
        <span class="menu-badge" id="cekBadge">0</span>
    </a>
    <a class="menu-link" href="history.html"><button>HISTORY LAPORAN</button></a>
    <a class="menu-link" href="review.html">
        <button>REVIEW LAPORAN</button>
        <span class="menu-badge" id="reviewBadge">0</span>
    </a>

    <div id="adminSection" style="display:none;">
        <a class="menu-link" href="admin.html">
            <button class="admin-btn">PANEL ADMIN</button>
            <span class="menu-badge" id="panelAdminBadge">0</span>
        </a>
    </div>

    <a href="ubah-password.html">
        <button style="background:#f39c12;">UBAH PASSWORD</button>
    </a>

    <hr class="separator">
    <button class="logout-btn" onclick="logout()">LOGOUT</button>
</div>

<script src="config.js"></script>
<script>
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");
    const fullUsername = localStorage.getItem("username") || "";

    if (!token) {
        window.location.href = "login.html";
    } else if (localStorage.getItem("mustChangePassword") === "true") {
        window.location.href = "reset-first-password.html";
    }

    const displayName = fullUsername.split('@')[0].toUpperCase();

    document.addEventListener("DOMContentLoaded", function() {
        const userInfoEl = document.getElementById("userInfo");
        if (userInfoEl) {
            userInfoEl.innerHTML = `Selamat Datang, ${displayName}`;
        }

        if (role === "admin") {
            const adminBox = document.getElementById("adminSection");
            if (adminBox) adminBox.style.display = "block";
        }

        loadNotificationBadges();
    });

    async function loadNotificationBadges() {
        try {
            const response = await fetch(
                API_URL +
                "?action=notificationCounts" +
                "&token=" + encodeURIComponent(token)
            );

            const data = await response.json();

            if (!data || data.success === false) {
                return;
            }

            if (role === "admin") {
                setBadge("cekBadge", 0);
                setBadge("panelAdminBadge", Number(data.admin_active_count || 0));
            } else {
                setBadge("cekBadge", Number(data.active_count || 0));
                setBadge("panelAdminBadge", 0);
            }

            setBadge("reviewBadge", Number(data.review_count || 0));
        } catch (error) {
            console.error(error);
        }
    }

    function setBadge(id, count) {
        const badge = document.getElementById(id);
        if (!badge) return;

        if (count > 0) {
            badge.textContent = count > 99 ? "99+" : String(count);
            badge.style.display = "inline-block";
        } else {
            badge.style.display = "none";
        }
    }

    function logout() {
        if (confirm("Apakah Anda yakin ingin keluar?")) {
            // Simpan savedUsername sebelum clear
            const savedUsername = localStorage.getItem("savedUsername");
            
            // Clear semua localStorage
            localStorage.clear();
            
            // Restore savedUsername jika ada
            if (savedUsername) {
                localStorage.setItem("savedUsername", savedUsername);
            }
            
            window.location.href = "login.html";
        }
    }
</script>

</body>
</html>
