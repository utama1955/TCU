<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Maintenance Aset</title>
<link rel="icon" type="image/png" href="icon.png">

<style>
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

.limit-btn {
  background:#2c5364;
  color:white;
}

.limit-btn.active {
  background:#27ae60;
}
  
.container{
width:95%;
max-width:1300px;
margin:30px auto;
background:white;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
overflow:hidden;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 25px;
background:#2c5364;
color:white;
}

.logout-btn{
background:#e74c3c;
border:none;
padding:8px 15px;
color:white;
border-radius:6px;
cursor:pointer;
}

.admin-back-btn{
width:34px;
height:34px;
border-radius:50%;
border:none;
background:#426878;
color:white;
font-size:26px;
font-weight:800;
line-height:1;
display:flex;
align-items:center;
justify-content:center;
padding:0 2px 2px 0;
cursor:pointer;
transition:background 0.2s ease, transform 0.2s ease;
}

.admin-back-btn:hover{
background:#345766;
transform:translateX(-1px);
}

.content{
padding:25px;
overflow-x:auto;
}

.filter-box{
margin-bottom:15px;
}

table{
width:100%;
min-width:1100px;
border-collapse:collapse;
font-size:14px;
}

th{
background:#2c5364;
color:white;
padding:12px;
text-align:left;
}

td{
padding:12px;
border-bottom:1px solid #eee;
}

th.center-col,
td.center-col{
text-align:center;
vertical-align:middle;
}

tr:hover{
background:#f8f8f8;
}

.status{
padding:4px 10px;
border-radius:20px;
color:white;
font-size:12px;
font-weight:600;
}

.waiting{background:#f39c12;}
.pending{background:#9b59b6;}
.process{background:#3498db;}
.done{background:#27ae60;}

button{
padding:6px 12px;
border:none;
border-radius:6px;
cursor:pointer;
background:#2c5364;
color:white;
}

button:disabled{
background:#bdc3c7;
cursor:not-allowed;
}

/* MODAL */
.modal{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
justify-content:center;
align-items:center;
z-index:1000;
}

.modal-content{
background:white;
width:95%;
max-width:500px;
padding:25px;
border-radius:14px;
box-shadow:0 20px 40px rgba(0,0,0,0.35);
position:relative;
animation:fadeIn 0.2s ease-in-out;
}

.foto-modal-content{
max-width:420px;
padding:20px;
}

.foto-viewer{
position:relative;
display:flex;
align-items:center;
justify-content:center;
margin-top:12px;
}

.foto-viewer img{
width:100%;
max-height:70vh;
object-fit:contain;
border-radius:10px;
background:white;
}

.foto-nav{
position:absolute;
top:50%;
transform:translateY(-50%);
width:36px;
height:36px;
border-radius:50%;
background:rgba(44,83,100,0.9);
color:white;
border:none;
font-size:22px;
font-weight:bold;
display:flex;
align-items:center;
justify-content:center;
padding:0;
}

.foto-nav.prev{
left:8px;
}

.foto-nav.next{
right:8px;
}

.foto-nav:disabled{
display:none;
}

.foto-counter{
margin-top:10px;
font-size:13px;
font-weight:700;
color:#2c5364;
text-align:center;
}
  
@keyframes fadeIn{
from{opacity:0; transform:scale(0.95);}
to{opacity:1; transform:scale(1);}
}

.modal-content h3{
text-align:center;
color:#2c5364;
margin-bottom:20px;
}

.close-btn{
position:absolute;
top:12px;
right:15px;
font-size:22px;
font-weight:bold;
color:#e74c3c;
cursor:pointer;
transition:0.2s;
}

.close-btn:hover{
color:#c0392b;
transform:scale(1.1);
}

.modal-content label{
display:block;
margin-top:12px;
font-size:13px;
font-weight:600;
}

.modal-content input,
.modal-content textarea,
.modal-content select{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
margin-top:5px;
box-sizing:border-box;
}

.save-btn{
width:100%;
padding:12px;
margin-top:15px;
border-radius:8px;
font-weight:600;
background:#27ae60;
color:white;
border:none;
cursor:pointer;
}

.footer{
text-align:center;
padding:15px;
font-size:12px;
color:#777;
}
</style>
</head>

<body>

<script>
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");

if(!token){
  window.location.href="login.html";
}

if(role !== "admin"){
  alert("Akses admin ditolak.");
  window.location.href="index.html";
}
</script>

<div class="container">

<div class="header">

<div style="display:flex;align-items:center;gap:15px;">

<button type="button" class="admin-back-btn" onclick="goBack()" aria-label="Kembali">
‹
</button>

<h2 style="margin:0;">Admin Panel - Maintenance Aset</h2>

</div>

<button class="logout-btn" onclick="logout()">Logout</button>

</div>

<div class="content">

<div class="filter-box">
<label><strong>Filter Status:</strong></label>
<select id="filterStatus" onchange="applyFilter()">
<option value="All">All</option>
<option value="Waiting">Waiting</option>
<option value="Pending">Pending</option>
<option value="On Progress">On Progress</option>
<option value="Done">Done</option>
</select>
</div>

<table id="tabel">
<thead>
<tr>
<th>Ticket</th>
<th>Pelapor</th>
<th>Cabang</th>
<th>Aset</th>
<th class="center-col">Deskripsi</th>
<th class="center-col">Foto</th>
<th class="center-col">Penawaran Vendor</th>
<th class="center-col">Status</th>
<th>Vendor</th>
<th class="center-col">Update</th>
<th class="center-col">Action</th>
</tr>
</thead>
<tbody>
<tr><td colspan="11">Loading...</td></tr>
</tbody>
</table>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:15px;">

<div>
<button class="limit-btn active" id="limit20" onclick="setLimit(20)">20</button>
<button class="limit-btn" id="limit50" onclick="setLimit(50)">50</button>
<button class="limit-btn" id="limit100" onclick="setLimit(100)">100</button>
</div>

<button id="loadMoreBtn" onclick="loadMore()">Load More</button>

</div>
  
</div>

<div class="footer">
Maintenance Asset Management System
</div>
</div>

<!-- MODAL EDIT -->
<div id="editModal" class="modal" onclick="overlayClose(event,'editModal')">
<div class="modal-content foto-modal-content">
<span class="close-btn" onclick="closeModal('editModal')">&times;</span>
<h3>Edit Ticket</h3>

<label>Ticket ID</label>
<input id="edit_ticket" readonly>

<label>Status</label>
<select id="edit_status">
<option value="Waiting">Waiting</option>
<option value="Pending">Pending</option>
<option value="On Progress">On Progress</option>
<option value="Done">Done</option>
</select>

<label>Catatan GA</label>
<textarea id="edit_catatan"></textarea>

<label>Vendor</label>
<input id="edit_vendor">

<label>Estimasi Selesai</label>
<input id="edit_estimasi" placeholder="Contoh: 3 hari kerja">

<label>Penawaran Vendor</label>
<input type="file" id="edit_penawaran" accept="image/*">

  
<button class="save-btn" onclick="saveEdit()">Save</button>
</div>
</div>

<!-- MODAL DESKRIPSI -->
<div id="descModal" class="modal" onclick="overlayClose(event,'descModal')">
<div class="modal-content">
<span class="close-btn" onclick="closeModal('descModal')">&times;</span>
<h3>Deskripsi Kerusakan</h3>
<div id="descContent" style="margin-top:15px; line-height:1.2;"></div>
</div>
</div>

<!-- MODAL FOTO -->
<div id="fotoModal" class="modal" onclick="overlayClose(event,'fotoModal')">
  <div class="modal-content foto-modal-content">
    <span class="close-btn" onclick="closeModal('fotoModal')">&times;</span>
    <h3>Foto Laporan</h3>

    <div class="foto-viewer">
      <button type="button" id="fotoPrevBtn" class="foto-nav prev" onclick="changeFoto(-1)">&#8249;</button>
      <img id="fotoContent" alt="Foto Laporan">
      <button type="button" id="fotoNextBtn" class="foto-nav next" onclick="changeFoto(1)">&#8250;</button>
    </div>
    <div id="fotoCounter" class="foto-counter"></div>

  </div>
</div>

<script src="config.js"></script>
<script>

let allTickets = [];
let visibleCount = 20; // default tampil 20
let isSavingEdit = false;
let activeFotos = [];
let activeFotoIndex = 0;

function goBack(){
  window.location.href="index.html";
}

function logout(){
  localStorage.clear();
  window.location.href="login.html";
}

function formatTanggalIndonesia(t){
  if(!t) return "-";
  const d=new Date(t);
  if(isNaN(d)) return "-";
  return String(d.getDate()).padStart(2,'0')+"/"+
  String(d.getMonth()+1).padStart(2,'0')+"/"+
  d.getFullYear();
}

async function loadData(){

  const token = localStorage.getItem("token");

  const res = await fetch(
    API_URL + "?action=list&token=" + encodeURIComponent(token)
  );

  const data = await res.json();
  if(data.session_expired){
  alert("Session berakhir. Silakan login ulang.");
  localStorage.clear();
  window.location.href = "login.html";
  return;
}

  if(!data || data.success === false){
    alert("Session habis. Silakan login ulang.");
    localStorage.clear();
    window.location.href="login.html";
    return;
  }

  allTickets = data;
  applyFilter();
}

function getFilteredTickets(){
  const statusFilter = document.getElementById("filterStatus").value;

  if(statusFilter === "All"){
    return allTickets;
  }

  return allTickets.filter(row => (row.status || "Waiting") === statusFilter);
}

function applyFilter(){
  visibleCount = 20;

  document.getElementById("limit20").classList.add("active");
  document.getElementById("limit50").classList.remove("active");
  document.getElementById("limit100").classList.remove("active");

  renderTable(getFilteredTickets());
}

function renderTable(data){

  const tbody=document.querySelector("#tabel tbody");
  tbody.innerHTML="";

  if(!Array.isArray(data) || data.length === 0){
    tbody.innerHTML='<tr><td colspan="11">Tidak ada data sesuai filter.</td></tr>';
    updateLoadMoreButton(0);
    return;
  }

  // Urut terbaru di atas
  data.sort((a,b)=>{
  return new Date(b.tanggal).getTime() - new Date(a.tanggal).getTime();
});;

  const visibleData = data.slice(0, visibleCount);

  visibleData.forEach(row=>{

    const status=row.status||"Waiting";
    let statusClass="waiting";
    if(status==="Pending") statusClass="pending";
    if(status==="On Progress") statusClass="process";
    if(status==="Done") statusClass="done";

    const disabled=status==="Done"?"disabled":"";

    tbody.innerHTML+=`
    <tr>
    <td>${row.id||"-"}</td>
    <td>${row.nama||"-"}</td>
    <td>${row.departemen||"-"}</td>
    <td>${row.aset||"-"}</td>
    <td class="center-col"><button onclick="showDescription('${encodeURIComponent(row.deskripsi||"")}')">Lihat</button></td>
    <td class="center-col">${renderFotoButton(row.foto)}</td>
    <td class="center-col">${renderFotoButton(row.penawaran)}</td>
    <td class="center-col"><span class="status ${statusClass}">${status}</span></td>
    <td>${row.vendor||"-"}</td>
    <td class="center-col">${formatTanggalIndonesia(row.update)}</td>
    <td class="center-col">
   <button ${disabled} onclick="openEditModal('${encodeURIComponent(row.id||"")}','${encodeURIComponent(status)}','${encodeURIComponent(row.catatan||"")}','${encodeURIComponent(row.vendor||"")}','${encodeURIComponent(row.estimasi||"")}')">
    ${status==="Done"?"Close":"Edit"}
    </button>
    </td>
    </tr>`;
  });

  updateLoadMoreButton(data.length);
}

function setLimit(limit){

  visibleCount = limit;

  // reset semua tombol
  document.getElementById("limit20").classList.remove("active");
  document.getElementById("limit50").classList.remove("active");
  document.getElementById("limit100").classList.remove("active");

  // aktifkan yang dipilih
  document.getElementById("limit"+limit).classList.add("active");

  renderTable(getFilteredTickets());
}

function loadMore(){
  visibleCount += 20;
  renderTable(getFilteredTickets());
}

function updateLoadMoreButton(totalData){
  const btn = document.getElementById("loadMoreBtn");
  if(!btn) return;

  if(visibleCount >= totalData){
    btn.style.display="none";
  }else{
    btn.style.display="inline-block";
  }
}

function showDescription(desc){
  document.getElementById("descContent").innerText=
  decodeURIComponent(desc)||"Tidak ada deskripsi.";
  document.getElementById("descModal").style.display="flex";
}

function parseFotoList(value){
  const foto = String(value || "").trim();

  if(!foto){
    return [];
  }

  try{
    const parsed = JSON.parse(foto);
    if(Array.isArray(parsed)){
      return parsed.filter(url => String(url || "").trim() !== "");
    }
  }catch(error){
  }

  return [foto];
}

function renderFotoButton(value){
  const fotos = parseFotoList(value);

  if(fotos.length === 0){
    return "-";
  }

  const label = fotos.length > 1 ? "" + fotos.length + " Foto" : "Lihat";
  const payload = encodeURIComponent(JSON.stringify(fotos));

  return `<button onclick="showFoto('${payload}')">${label}</button>`;
}
  
function showFoto(payload){
  let fotos = [];

  try{
    fotos = JSON.parse(decodeURIComponent(payload));
  }catch(error){
    fotos = [decodeURIComponent(payload)];
  }

  if(fotos.length === 0){
    alert("Foto tidak tersedia");
    return;
  }

  activeFotos = fotos;
  activeFotoIndex = 0;
  renderActiveFoto();
  document.getElementById("fotoModal").style.display = "flex";
}

function renderActiveFoto(){
  const img = document.getElementById("fotoContent");
  const counter = document.getElementById("fotoCounter");
  const prevBtn = document.getElementById("fotoPrevBtn");
  const nextBtn = document.getElementById("fotoNextBtn");

  if(!activeFotos.length){
    img.removeAttribute("src");
    counter.innerText = "";
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }

  img.src = activeFotos[activeFotoIndex];
  counter.innerText = activeFotos.length > 1 ? (activeFotoIndex + 1) + " / " + activeFotos.length : "";
  prevBtn.disabled = activeFotos.length <= 1;
  nextBtn.disabled = activeFotos.length <= 1;
}

function changeFoto(step){
  if(activeFotos.length <= 1) return;

  activeFotoIndex += step;

  if(activeFotoIndex < 0){
    activeFotoIndex = activeFotos.length - 1;
  }

  if(activeFotoIndex >= activeFotos.length){
    activeFotoIndex = 0;
  }

  renderActiveFoto();
}

function compressFoto(file){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();

    reader.onload = function(event){
      const img = new Image();

      img.onload = function(){
        const maxSize = 1280;
        let width = img.width;
        let height = img.height;

        if(width > height && width > maxSize){
          height = Math.round((height * maxSize) / width);
          width = maxSize;
        }else if(height > maxSize){
          width = Math.round((width * maxSize) / height);
          height = maxSize;
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);

        canvas.toBlob(function(blob){
          if(!blob){
            reject(new Error("Gagal kompres foto penawaran"));
            return;
          }

          resolve(new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type:"image/jpeg" }));
        }, "image/jpeg", 0.7);
      };

      img.onerror = function(){
        reject(new Error("Format foto penawaran tidak bisa diproses"));
      };

      img.src = event.target.result;
    };

    reader.onerror = function(){
      reject(new Error("Foto penawaran tidak bisa dibaca"));
    };

    reader.readAsDataURL(file);
  });
}

async function uploadPenawaran(file){
  if(!file) return "";

  const compressedFile = await compressFoto(file);
  const formData = new FormData();
  formData.append("file", compressedFile);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

  const response = await fetch(CLOUDINARY_URL, {
    method:"POST",
    body:formData
  });

  const data = await response.json();
  return data.secure_url || "";
}
  
function openEditModal(ticket,status,catatan,vendor,estimasi){
  const ticketValue = decodeURIComponent(ticket || "");
  const statusValue = decodeURIComponent(status || "Waiting");

  if(statusValue==="Done"){
    alert("Ticket sudah selesai dan tidak dapat diedit kembali.");
    return;
  }
  document.getElementById("edit_ticket").value=ticketValue;
  document.getElementById("edit_status").value=statusValue;
  document.getElementById("edit_catatan").value=decodeURIComponent(catatan || "");
  document.getElementById("edit_vendor").value=decodeURIComponent(vendor || "");
  document.getElementById("edit_estimasi").value=decodeURIComponent(estimasi || "");
  document.getElementById("edit_penawaran").value="";
  document.getElementById("editModal").style.display="flex";
}

function closeModal(id){
  if(id === "editModal" && isSavingEdit) return;

  document.getElementById(id).style.display="none";
}

function overlayClose(event,id){
  if(isSavingEdit) return;

  if(event.target.id===id){
    closeModal(id);
  }
}

async function saveEdit(){

  if(isSavingEdit) return;
  isSavingEdit = true;

  const saveBtn = document.querySelector(".save-btn");
  const editFields = document.querySelectorAll("#editModal input, #editModal textarea, #editModal select");

  saveBtn.disabled = true;
  saveBtn.innerText = "Menyimpan...";
  editFields.forEach(field => field.disabled = true);

try{
  const penawaranFile = document.getElementById("edit_penawaran").files[0];
  let penawaranUrl = "";

  if(penawaranFile){
    if(!penawaranFile.type || penawaranFile.type.indexOf("image/") !== 0){
      alert("File penawaran harus berupa foto/gambar.");
      resetSaveButton();
      return;
    }

    saveBtn.innerText = "Upload penawaran...";
    penawaranUrl = await uploadPenawaran(penawaranFile);

    if(!penawaranUrl){
      alert("Gagal upload penawaran vendor. Silakan coba lagi.");
      resetSaveButton();
      return;
    }
  }

  saveBtn.innerText = "Menyimpan...";

  const formData=new FormData();
  formData.append("action","updateTicket");
  formData.append("token", localStorage.getItem("token"));
  formData.append("ticket_id",document.getElementById("edit_ticket").value);
  formData.append("status",document.getElementById("edit_status").value);
  formData.append("catatan",document.getElementById("edit_catatan").value);
  formData.append("vendor",document.getElementById("edit_vendor").value);
  formData.append("estimasi",document.getElementById("edit_estimasi").value);
  formData.append("penawaran",penawaranUrl);


  const res=await fetch(API_URL,{method:"POST",body:formData});
  const result=await res.json();
  if(result.session_expired){
  alert("Session berakhir. Silakan login ulang.");
  localStorage.clear();
  window.location.href = "login.html";
  return;
}

  if(result.success){
    resetSaveButton();
    closeModal('editModal');
    alert("Update ticket berhasil disimpan.");
    loadData();
    return;
  }else{
    alert(result.message || "Gagal menyimpan update ticket. Silakan coba lagi.");
    resetSaveButton();
    return;
  }

}catch(error){
  console.error("SAVE EDIT ERROR:", error);
  alert("Gagal menyimpan perubahan. Silakan coba lagi.");
  resetSaveButton();
  return;
}
}

function resetSaveButton(){
  const saveBtn = document.querySelector(".save-btn");
  const editFields = document.querySelectorAll("#editModal input, #editModal textarea, #editModal select");

  if(saveBtn){
    saveBtn.disabled = false;
    saveBtn.innerText = "Save";
  }

  editFields.forEach(field => field.disabled = false);
  isSavingEdit = false;
}

// load saat halaman dibuka
loadData();

</script>

</body>
