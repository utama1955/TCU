<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubah Password</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
box-sizing:border-box;
}
.container{
background:white;
width:100%;
max-width:420px;
padding:30px;
border-radius:12px;
box-shadow:0 15px 30px rgba(0,0,0,0.3);
box-sizing:border-box;
}
h2{text-align:center;margin-top:0;}
.password-group{position:relative;margin-top:12px;}
.password-group input{
width:100%;
padding:14px 62px 14px 14px;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}
.toggle-password{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
border:0;
background:transparent;
color:#2c5364;
font-size:12px;
font-weight:bold;
cursor:pointer;
padding:5px;
}
.action-button,.back-button{
width:100%;
padding:14px;
margin-top:18px;
border-radius:8px;
border:0;
color:white;
cursor:pointer;
font-weight:bold;
}
.action-button{background:#2c5364;}
.action-button:disabled{background:#91a0a7;cursor:not-allowed;}
.back-button{background:#6c757d;}
#status{margin-top:15px;text-align:center;font-size:14px;min-height:20px;color:#c0392b;}
.password-info{font-size:13px;color:#666;line-height:1.5;text-align:center;}
</style>
</head>
<body>
<div class="container">
  <h2>Ubah Password</h2>
  <p class="password-info">Password harus terdiri dari 8-64 karakter serta mengandung huruf dan angka.</p>

  <div class="password-group">
    <input type="password" id="oldPassword" placeholder="Password lama" autocomplete="current-password">
    <button type="button" class="toggle-password" onclick="togglePassword('oldPassword', this)">Lihat</button>
  </div>

  <div class="password-group">
    <input type="password" id="newPassword" placeholder="Password baru" autocomplete="new-password">
    <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)">Lihat</button>
  </div>

  <div class="password-group">
    <input type="password" id="confirmPassword" placeholder="Konfirmasi password baru" autocomplete="new-password">
    <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">Lihat</button>
  </div>

  <button id="btnSimpan" class="action-button" onclick="ubahPassword()">Simpan</button>
  <p id="status"></p>
  <button class="back-button" onclick="window.location.href='index.html'">Kembali</button>
</div>

<script src="config.js"></script>
<script>
const token = localStorage.getItem("token");
let isProcessing = false;

if(!token){
  alert("Silakan login terlebih dahulu.");
  window.location.href = "login.html";
}else if(localStorage.getItem("mustChangePassword") === "true"){
  window.location.href = "reset-first-password.html";
}

function togglePassword(id, button){
  const input = document.getElementById(id);
  const showPassword = input.type === "password";
  input.type = showPassword ? "text" : "password";
  button.innerText = showPassword ? "Tutup" : "Lihat";
}

function validatePassword(password){
  if(password.length < 8) return "Password minimal 8 karakter.";
  if(password.length > 64) return "Password maksimal 64 karakter.";
  if(/\s/.test(password)) return "Password tidak boleh mengandung spasi.";
  if(!/[A-Za-z]/.test(password) || !/[0-9]/.test(password)){
    return "Password harus mengandung huruf dan angka.";
  }
  return "";
}

async function ubahPassword(){
  if(isProcessing) return;

  const button = document.getElementById("btnSimpan");
  const status = document.getElementById("status");
  const oldPass = document.getElementById("oldPassword").value;
  const newPass = document.getElementById("newPassword").value;
  const confirmation = document.getElementById("confirmPassword").value;

  if(!oldPass || !newPass || !confirmation){
    status.innerText = "Semua field wajib diisi.";
    return;
  }

  const validationMessage = validatePassword(newPass);
  if(validationMessage){
    status.innerText = validationMessage;
    return;
  }

  if(newPass !== confirmation){
    status.innerText = "Konfirmasi password tidak sama.";
    return;
  }

  if(newPass === oldPass){
    status.innerText = "Password baru tidak boleh sama dengan password lama.";
    return;
  }

  isProcessing = true;
  button.disabled = true;
  button.innerText = "Memproses...";

  try{
    const res = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:
        "action=changePassword" +
        "&oldPassword=" + encodeURIComponent(oldPass) +
        "&newPassword=" + encodeURIComponent(newPass) +
        "&token=" + encodeURIComponent(token)
    });
    const data = await res.json();

    if(data.session_expired){
      alert("Session berakhir. Silakan login ulang.");
      clearSessionPreservingUsername();
      window.location.href = "login.html";
      return;
    }

    if(data.success){
      alert("Password berhasil diubah. Silakan login kembali.");
      clearSessionPreservingUsername();
      window.location.href = "login.html";
      return;
    }

    status.innerText = data.message || "Password tidak dapat diubah.";
  }catch(error){
    console.error(error);
    status.innerText = "Terjadi kesalahan koneksi.";
  }finally{
    isProcessing = false;
    button.disabled = false;
    button.innerText = "Simpan";
  }
}

function clearSessionPreservingUsername(){
  const savedUsername = localStorage.getItem("savedUsername");
  localStorage.clear();
  if(savedUsername) localStorage.setItem("savedUsername", savedUsername);
}
</script>
</body>
</html>
