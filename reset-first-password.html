<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password Pertama - Lapor Bolo</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
box-sizing:border-box;
}
.container{
background:white;
width:100%;
max-width:420px;
padding:30px;
border-radius:12px;
box-shadow:0 15px 30px rgba(0,0,0,0.3);
box-sizing:border-box;
text-align:center;
}
h2{color:#333;margin-top:0;font-size:20px;}
p{font-size:14px;color:#666;margin-bottom:20px;line-height:1.5;}
.password-wrapper{position:relative;width:100%;margin-top:10px;}
input{
width:100%;
padding:14px 62px 14px 14px;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
font-size:14px;
}
.toggle-password{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
border:0;
background:transparent;
color:#2c5364;
font-size:12px;
font-weight:bold;
cursor:pointer;
padding:5px;
}
.btn-save,.logout-btn{
width:100%;
padding:14px;
border:0;
border-radius:8px;
color:white;
font-weight:bold;
cursor:pointer;
}
.btn-save{margin-top:25px;background:#27ae60;}
.btn-save:disabled{background:#9bbca8;cursor:not-allowed;}
.logout-btn{margin-top:15px;background:#e74c3c;font-size:13px;}
#status{margin-top:15px;font-size:13px;color:#c0392b;min-height:20px;}
</style>
</head>
<body>
<div class="container">
  <h2>Ganti Password Baru</h2>
  <p>Password harus terdiri dari 8-64 karakter serta mengandung huruf dan angka.</p>

  <div class="password-wrapper">
    <input type="password" id="newPass" placeholder="Password baru" autocomplete="new-password">
    <button type="button" class="toggle-password" onclick="toggleVisibility('newPass', this)">Lihat</button>
  </div>

  <div class="password-wrapper">
    <input type="password" id="confirmPass" placeholder="Konfirmasi password baru" autocomplete="new-password">
    <button type="button" class="toggle-password" onclick="toggleVisibility('confirmPass', this)">Lihat</button>
  </div>

  <button id="resetButton" class="btn-save" onclick="handleReset()">SIMPAN PASSWORD</button>
  <div id="status"></div>

  <hr style="margin:25px 0 15px;border:0;border-top:1px solid #eee;">
  <button class="logout-btn" onclick="logout()">Batal &amp; Logout</button>
</div>

<script src="config.js"></script>
<script>
const username = localStorage.getItem("username");
const token = localStorage.getItem("token");
const mustChangePassword = localStorage.getItem("mustChangePassword") === "true";
let isProcessing = false;

if(!username || !token){
  window.location.href = "login.html";
}else if(!mustChangePassword){
  window.location.href = "index.html";
}

function toggleVisibility(id, button){
  const input = document.getElementById(id);
  const showPassword = input.type === "password";
  input.type = showPassword ? "text" : "password";
  button.innerText = showPassword ? "Tutup" : "Lihat";
}

function validatePassword(password){
  if(password.length < 8) return "Password minimal 8 karakter.";
  if(password.length > 64) return "Password maksimal 64 karakter.";
  if(/\s/.test(password)) return "Password tidak boleh mengandung spasi.";
  if(!/[A-Za-z]/.test(password) || !/[0-9]/.test(password)){
    return "Password harus mengandung huruf dan angka.";
  }
  return "";
}

async function handleReset(){
  if(isProcessing) return;

  const newPass = document.getElementById("newPass").value;
  const confirmPass = document.getElementById("confirmPass").value;
  const status = document.getElementById("status");
  const button = document.getElementById("resetButton");
  const validationMessage = validatePassword(newPass);

  if(validationMessage){
    status.innerText = validationMessage;
    return;
  }

  if(newPass !== confirmPass){
    status.innerText = "Konfirmasi password tidak cocok.";
    return;
  }

  isProcessing = true;
  button.disabled = true;
  button.innerText = "MENYIMPAN...";
  status.innerText = "Sedang menyimpan...";

  try{
    const res = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:
        "action=resetFirstPassword" +
        "&newPassword=" + encodeURIComponent(newPass) +
        "&token=" + encodeURIComponent(token)
    });
    const data = await res.json();

    if(data.success){
      alert("Password berhasil dibuat. Silakan login kembali.");
      clearSessionPreservingUsername();
      window.location.href = "login.html";
      return;
    }

    if(data.session_expired){
      alert("Session berakhir. Silakan login ulang.");
      clearSessionPreservingUsername();
      window.location.href = "login.html";
      return;
    }

    status.innerText = data.message || "Password tidak dapat disimpan.";
  }catch(error){
    console.error(error);
    status.innerText = "Kesalahan koneksi ke server.";
  }finally{
    isProcessing = false;
    button.disabled = false;
    button.innerText = "SIMPAN PASSWORD";
  }
}

function logout(){
  if(confirm("Batal melakukan reset dan keluar?")){
    clearSessionPreservingUsername();
    window.location.href = "login.html";
  }
}

function clearSessionPreservingUsername(){
  const savedUsername = localStorage.getItem("savedUsername");
  localStorage.clear();
  if(savedUsername) localStorage.setItem("savedUsername", savedUsername);
}
</script>
</body>
</html>
